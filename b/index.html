<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ვეფხისტყაოსანი</title>
<meta name="description" content="შოთა რუსთაველის „ვეფხისტყაოსნის“ ლეგენდა — რვა აქტი, რომელიც სქროლით იშლება.">
<meta name="theme-color" content="#e9e1d3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='6' fill='%23f1e6cf'/%3E%3Cpath d='M9 27c5-9 12-13 22-14-4 3-6 6-7 10-4-3-9-1-15 4z' fill='%23a3732b'/%3E%3Ccircle cx='27' cy='14' r='2' fill='%233b2a17'/%3E%3C/svg%3E">

<link rel="preload" href="../assets/fonts/noto-serif-georgian-georgian.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" as="image" href="assets/img/00-prologue.webp" media="(min-width: 700px)">
<link rel="preload" as="image" href="assets/img/00-prologue-m.webp" media="(max-width: 699px)">
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/b.css">
</head>
<body>

<!-- ── the stack ──────────────────────────────────────────────
     Each act is a card on a sticky pin. Scrolled to, a card rises from
     below, pins to the screen and holds while its film runs; the next
     card then slides up over it while it settles back and dims. All
     pins share one parent, so every card stays stuck beneath the ones
     that follow — a deck, built by the reader's scroll.

     Films never play on their own: scroll writes their currentTime.
     An act's parts arrive in data-o order once its card has pinned,
     each with the entrance named in data-fx. Quotations from the poem
     are set in „ “ ; lines without them are narration. -->
<main class="stack" id="stack">
  <section class="pin" id="act-0" data-scene="0" style="z-index:1">
    <figure class="card card--prologue">
      <video class="film" muted playsinline preload="none" disableremoteplayback
             data-name="00-prologue" aria-hidden="true"></video>
      <div class="scrim" aria-hidden="true"></div>
      <div class="flare" aria-hidden="true"></div>
      <article class="act act--prologue">
        <p class="label" data-o="0" data-fx="rise">შოთა რუსთაველი</p>
        <h1 class="title" data-o="1" data-fx="letters">ვეფხისტყაოსანი</h1>
        <span class="rule" data-o="2" data-fx="draw" aria-hidden="true"></span>
        <p class="verse" data-o="3" data-fx="lines">„რომელმან შექმნა სამყარო<br>ძალითა მით ძლიერითა“</p>
        <p class="cue" data-o="4" data-fx="rise"><span aria-hidden="true"></span>ჩამოსქროლე — ამბავი იშლება</p>
      </article>
      <div class="dim" aria-hidden="true"></div>
    </figure>
  </section>
  <div class="gap" aria-hidden="true"></div>
  <section class="pin" id="act-1" data-scene="1" style="z-index:2">
    <figure class="card">
      <video class="film" muted playsinline preload="none" disableremoteplayback
             data-name="01-tinatin" aria-hidden="true"></video>
      <div class="scrim" aria-hidden="true"></div>
      <div class="flare" aria-hidden="true"></div>
      <article class="act">
        <span class="numeral" data-o="0" data-fx="num" aria-hidden="true">II</span>
        <p class="label" data-o="1" data-fx="rise">თინათინის მეფობა</p>
        <span class="rule" data-o="2" data-fx="draw" aria-hidden="true"></span>
        <p class="verse" data-o="3" data-fx="lines">„ლეკვი ლომისა სწორია,<br>ძუ იყოს, თუნდა ხვადია.“</p>
        <p class="gloss" data-o="5" data-fx="blur">არაბეთის მეფე როსტევანი ტახტს თავის ასულს უთმობს.</p>
      </article>
      <div class="dim" aria-hidden="true"></div>
    </figure>
  </section>
  <div class="gap" aria-hidden="true"></div>
  <section class="pin" id="act-2" data-scene="2" style="z-index:3">
    <figure class="card">
      <video class="film" muted playsinline preload="none" disableremoteplayback
             data-name="02-stranger" aria-hidden="true"></video>
      <div class="scrim" aria-hidden="true"></div>
      <div class="flare" aria-hidden="true"></div>
      <article class="act">
        <span class="numeral" data-o="0" data-fx="num" aria-hidden="true">III</span>
        <p class="label" data-o="1" data-fx="rise">უცხო მოყმე</p>
        <span class="rule" data-o="2" data-fx="draw" aria-hidden="true"></span>
        <p class="verse" data-o="3" data-fx="lines">მდინარის პირას იჯდა მოყმე,<br>ვეფხის ტყავით მოსილი.</p>
        <p class="gloss" data-o="5" data-fx="blur">მეფემ იგი ნადირობისას იხილა — და ვერავინ შეიპყრო.</p>
      </article>
      <div class="dim" aria-hidden="true"></div>
    </figure>
  </section>
  <div class="gap" aria-hidden="true"></div>
  <section class="pin" id="act-3" data-scene="3" style="z-index:4">
    <figure class="card">
      <video class="film" muted playsinline preload="none" disableremoteplayback
             data-name="03-quest" aria-hidden="true"></video>
      <div class="scrim" aria-hidden="true"></div>
      <div class="flare" aria-hidden="true"></div>
      <article class="act">
        <span class="numeral" data-o="0" data-fx="num" aria-hidden="true">IV</span>
        <p class="label" data-o="1" data-fx="rise">ავთანდილის ძებნა</p>
        <span class="rule" data-o="2" data-fx="draw" aria-hidden="true"></span>
        <p class="verse" data-o="3" data-fx="lines">„ჭირსა შიგან გამაგრება,<br>ასრე უნდა, ვით ქვითკირსა.“</p>
        <p class="gloss" data-o="5" data-fx="blur">თინათინმა ავთანდილი გაგზავნა — სამი წლით, უცნობის საძიებლად.</p>
      </article>
      <div class="dim" aria-hidden="true"></div>
    </figure>
  </section>
  <div class="gap" aria-hidden="true"></div>
  <section class="pin" id="act-4" data-scene="4" style="z-index:5">
    <figure class="card">
      <video class="film" muted playsinline preload="none" disableremoteplayback
             data-name="04-sky" aria-hidden="true"></video>
      <div class="scrim" aria-hidden="true"></div>
      <div class="flare" aria-hidden="true"></div>
      <article class="act act--breath">
        <p class="verse" data-o="0" data-fx="letters">სამი წელი.</p>
        <p class="verse" data-o="2" data-fx="letters">ერთი გზა.</p>
      </article>
      <div class="dim" aria-hidden="true"></div>
    </figure>
  </section>
  <div class="gap" aria-hidden="true"></div>
  <section class="pin" id="act-5" data-scene="5" style="z-index:6">
    <figure class="card">
      <video class="film" muted playsinline preload="none" disableremoteplayback
             data-name="05-nestan" aria-hidden="true"></video>
      <div class="scrim" aria-hidden="true"></div>
      <div class="flare" aria-hidden="true"></div>
      <article class="act">
        <span class="numeral" data-o="0" data-fx="num" aria-hidden="true">V</span>
        <p class="label" data-o="1" data-fx="rise">ნესტან-დარეჯანი</p>
        <span class="rule" data-o="2" data-fx="draw" aria-hidden="true"></span>
        <p class="verse" data-o="3" data-fx="lines">ქაჯეთის ციხეში დატყვევებული<br>წერილს უგზავნის ტარიელს.</p>
        <p class="gloss" data-o="5" data-fx="blur">ტარიელის სატრფო, ინდოეთის მეფის ასული.</p>
      </article>
      <div class="dim" aria-hidden="true"></div>
    </figure>
  </section>
  <div class="gap" aria-hidden="true"></div>
  <section class="pin" id="act-6" data-scene="6" style="z-index:7">
    <figure class="card">
      <video class="film" muted playsinline preload="none" disableremoteplayback
             data-name="06-brothers" aria-hidden="true"></video>
      <div class="scrim" aria-hidden="true"></div>
      <div class="flare" aria-hidden="true"></div>
      <article class="act">
        <span class="numeral" data-o="0" data-fx="num" aria-hidden="true">VI</span>
        <p class="label" data-o="1" data-fx="rise">ძმადნაფიცნი</p>
        <span class="rule" data-o="2" data-fx="draw" aria-hidden="true"></span>
        <p class="verse" data-o="3" data-fx="lines">ავთანდილი, ტარიელი, ფრიდონი —<br>სამი ხმალი, ერთი ფიცი.</p>
        <p class="gloss" data-o="5" data-fx="blur">მეგობრობა და ერთგულება — პოემის ხერხემალი.</p>
      </article>
      <div class="dim" aria-hidden="true"></div>
    </figure>
  </section>
  <div class="gap" aria-hidden="true"></div>
  <section class="pin" id="act-7" data-scene="7" style="z-index:8">
    <figure class="card">
      <video class="film" muted playsinline preload="none" disableremoteplayback
             data-name="07-kajeti" aria-hidden="true"></video>
      <div class="scrim" aria-hidden="true"></div>
      <div class="flare" aria-hidden="true"></div>
      <article class="act">
        <span class="numeral" data-o="0" data-fx="num" aria-hidden="true">VII</span>
        <p class="label" data-o="1" data-fx="rise">ქაჯეთის ციხე</p>
        <span class="rule" data-o="2" data-fx="draw" aria-hidden="true"></span>
        <p class="verse" data-o="3" data-fx="lines">„სჯობს სიცოცხლესა ნაძრახსა<br>სიკვდილი სახელოვანი.“</p>
        <p class="gloss" data-o="5" data-fx="blur">სამმა რაინდმა ქაჯეთი აიღო და ნესტანი იხსნა.</p>
      </article>
      <div class="dim" aria-hidden="true"></div>
    </figure>
  </section>
  <div class="gap" aria-hidden="true"></div>
  <section class="pin" id="act-8" data-scene="8" style="z-index:9">
    <figure class="card">
      <video class="film" muted playsinline preload="none" disableremoteplayback
             data-name="08-feast" aria-hidden="true"></video>
      <div class="scrim" aria-hidden="true"></div>
      <div class="flare" aria-hidden="true"></div>
      <article class="act">
        <span class="numeral" data-o="0" data-fx="num" aria-hidden="true">VIII</span>
        <p class="label" data-o="1" data-fx="rise">ეპილოგი</p>
        <span class="rule" data-o="2" data-fx="draw" aria-hidden="true"></span>
        <p class="verse" data-o="3" data-fx="lines">„ბოროტსა სძლია კეთილმან,<br>არსება მისი გრძელია.“</p>
        <p class="gloss" data-o="5" data-fx="blur">ორი ქორწილი — ტარიელისა და ნესტანის, ავთანდილისა და თინათინის.</p>
      </article>
      <div class="dim" aria-hidden="true"></div>
    </figure>
  </section>
  <div class="gap" aria-hidden="true"></div>
  <section class="pin" id="act-9" data-scene="9" style="z-index:10">
    <figure class="card">
      <video class="film" muted playsinline preload="none" disableremoteplayback
             data-name="09-colophon" aria-hidden="true"></video>
      <div class="scrim" aria-hidden="true"></div>
      <div class="flare" aria-hidden="true"></div>
      <article class="act">
        <p class="label" data-o="0" data-fx="rise">ბოლოთქმა</p>
        <span class="rule" data-o="1" data-fx="draw" aria-hidden="true"></span>
        <p class="verse" data-o="2" data-fx="lines">„ესე ამბავი სპარსული,<br>ქართულად ნათარგმანები“</p>
        <p class="gloss" data-o="4" data-fx="blur">შოთა რუსთაველი · XII საუკუნე</p>
      </article>
      <div class="dim" aria-hidden="true"></div>
    </figure>
  </section>
  <div class="gap" aria-hidden="true"></div>
  <section class="pin" id="act-10" data-scene="10" style="z-index:11">
    <figure class="card card--paper">
      <div class="parchment" aria-hidden="true"></div>
      <article class="act act--end on-paper">
        <p class="label" data-o="0" data-fx="rise">დასასრული</p>
        <p class="end-title" data-o="1" data-fx="letters">ვეფხისტყაოსანი</p>
        <span class="rule rule--center" data-o="2" data-fx="draw" aria-hidden="true"></span>
        <p class="gloss" data-o="3" data-fx="blur">რვა აქტი · შოთა რუსთაველის ლეგენდა</p>
        <p class="end-links" data-o="4" data-fx="rise">
        <button type="button" class="pill" data-jump="0">თავიდან</button>
        <a class="pill pill--ghost" href="../">A ვერსია</a>
        </p>
      </article>
      <div class="dim" aria-hidden="true"></div>
    </figure>
  </section>
  <div class="gap" aria-hidden="true"></div>
</main>

<!-- chrome and gold motes float over whichever card is on top -->
<canvas class="motes" id="motes" aria-hidden="true"></canvas>
<div class="hud" id="hud">
  <div class="hud__frame" id="hudFrame">
    <header class="chrome">
      <a class="brand" href="#act-0" data-jump="0" aria-label="ვეფხისტყაოსანი — დასაწყისი">ვეფხისტყაოსანი</a>
      <nav class="acts" aria-label="აქტები">
        <button type="button" data-jump="0" aria-label="I — პროლოგი">I</button>
        <button type="button" data-jump="1" aria-label="II — თინათინის მეფობა">II</button>
        <button type="button" data-jump="2" aria-label="III — უცხო მოყმე">III</button>
        <button type="button" data-jump="3" aria-label="IV — ავთანდილის ძებნა">IV</button>
        <button type="button" data-jump="5" aria-label="V — ნესტან-დარეჯანი">V</button>
        <button type="button" data-jump="6" aria-label="VI — ძმადნაფიცნი">VI</button>
        <button type="button" data-jump="7" aria-label="VII — ქაჯეთის ციხე">VII</button>
        <button type="button" data-jump="8" aria-label="VIII — ეპილოგი">VIII</button>
      </nav>
    </header>
    <footer class="meter" aria-hidden="true">
      <span class="meter__bar"><i id="meterFill"></i></span>
      <span class="meter__count"><b id="actNow">I</b><span>/</span>VIII</span>
    </footer>
  </div>
</div>

<noscript>
  <p class="noscript">ეს გვერდი სქროლით მართულ ანიმაციას იყენებს და JavaScript სჭირდება.</p>
</noscript>

<script src="assets/js/b.js"></script>
</body>
</html>
